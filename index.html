<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gagliese</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #07182d;
      overflow: hidden;
    }

    .page {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    .signature {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 6%;
      height: 55px;
      border-bottom: 1px solid rgba(246, 240, 226, 0.72);
    }

    .name {
      position: absolute;
      right: 0;
      bottom: 14px;
      color: #f6f0e2;
      font-family: "Times New Roman", Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .signature {
        left: 7%;
        right: 7%;
        bottom: 5%;
      }

      .name {
        font-size: 16px;
        letter-spacing: 0.3em;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="signature">
      <div class="name">Gagliese</div>
    </div>
  </main>
</body>
</html>
