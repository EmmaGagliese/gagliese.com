<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gagliese</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #07182d;
      overflow: hidden;
    }

    .page {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    .signature {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 7%;
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .line {
      height: 1px;
      background: rgba(246, 240, 226, 0.58);
      flex: 1;
    }

    .name {
      color: #f6f0e2;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.27em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .signature {
        left: 7%;
        right: 7%;
        bottom: 6%;
        gap: 18px;
      }

      .name {
        font-size: 17px;
        letter-spacing: 0.22em;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="signature">
      <div class="line"></div>
      <div class="name">Gagliese</div>
    </div>
  </main>
</body>
</html>
